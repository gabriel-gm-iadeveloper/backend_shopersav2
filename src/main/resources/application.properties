spring.application.name=backend_shopersa

# parámetros de la conexión
spring.datasource.url=jdbc:mysql://localhost:3306/bd_shopersa?serverTimezone=UTC&useSSL=false
spring.datasource.username=root


# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update   
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.uploads.products-dir=/uploads/products

# Habilita el logging detallado para todo el framework de Spring Security
logging.level.org.springframework.security=DEBUG

# Configuración del seed de datos
app.seed.enabled=true
app.seed.admin.email=admin@shopersa.cl
app.seed.admin.password=admin123.
app.seed.admin.nombres=Administrador
app.seed.admin.apellidos=Sistema

# Configuración del puerto del servidor
server.port=${PORT:8080}

