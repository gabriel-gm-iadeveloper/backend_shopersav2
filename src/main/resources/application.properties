
spring.application.name=backend_shopersa

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_shopersa?serverTimezone=UTC&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.uploads.products-dir=${UPLOADS_DIR:uploads/products}

# Security logging
logging.level.org.springframework.security=INFO

# Admin seed configuration
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
app.seed.admin.nombres=Administrador
app.seed.admin.apellidos=Sistema

# Server
server.port=${PORT:8080}

# SendGrid
sendgrid.api.key=${SENDGRID_API_KEY:}
